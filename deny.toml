[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
# Every unlisted license, including GPL-3.0, is denied by default.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # eframe's bundled UI fonts. Font licenses do not affect the product code
    # license, but cargo-deny checks them as part of the dependency graph.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
