[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
# Every unlisted license, including GPL-3.0, is denied by default.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
