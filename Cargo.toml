[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "warn"

[workspace.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rtrb = "0.4.1"
thiserror = "2.0"
